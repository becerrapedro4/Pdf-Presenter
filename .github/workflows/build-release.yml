name: Build y Release

# Se ejecuta al publicar un release, al pushear un tag v* (crea el release
# si no existe), o manualmente desde Actions (solo compila y deja artifacts).
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # para subir los ejecutables como assets del release
  actions: read     # requerido por el paso de firma de SignPath

jobs:
  build:
    name: Compilar (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: PDFPresenter6-win64.exe
          - os: macos-latest
            label: macOS
            artifact: PDFPresenter6-macos
          - os: ubuntu-latest
            label: Linux
            artifact: PDFPresenter6-linux
    env:
      # Si existe el secreto SIGNPATH_API_TOKEN, el paso de firma corre (solo Windows).
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 PyMuPDF numpy
          # NDI es opcional: si el paquete no está disponible en la plataforma,
          # el build continúa y la app arranca con NDI desactivado.
          pip install ndi-python || echo "⚠️ ndi-python no disponible; NDI quedará desactivado"

      - name: Compilar con PyInstaller
        run: python -m PyInstaller PDFPresenter6.spec --noconfirm

      - name: Renombrar ejecutable
        shell: bash
        run: |
          if [ -f "dist/PDFPresenter6.exe" ]; then
            SRC="dist/PDFPresenter6.exe"
          else
            SRC="dist/PDFPresenter6"
          fi
          mv "$SRC" "dist/${{ matrix.artifact }}"

      - name: Verificar ejecutable
        shell: bash
        run: |
          ls -la "dist/${{ matrix.artifact }}"
          test -s "dist/${{ matrix.artifact }}" && echo "OK: ${{ matrix.artifact }}"

      - name: Subir ejecutable sin firmar (artifact)
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-unsigned
          path: dist/${{ matrix.artifact }}
          archive: false

      # ---- FIRMA OPCIONAL (SignPath Foundation - gratis para open source) ----
      # Para activarla:
      #   1. Solicitá la firma OSS en https://signpath.org (requiere licencia OSI
      #      en el repo y que el binario se genere en runners de GitHub).
      #   2. Agregá estos secretos al repo: SIGNPATH_API_TOKEN,
      #      SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #      SIGNPATH_SIGNING_POLICY_SLUG.
      - name: Firmar con SignPath (solo Windows)
        if: env.HAS_SIGNPATH == 'true' && matrix.os == 'windows-latest'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
          # parameters: |            # descomentar si la política lo requiere
          #   version: "6.1"

      - name: Usar el ejecutable firmado si existe
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -f "dist-signed/${{ matrix.artifact }}" ]; then
            cp "dist-signed/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}"
            echo "✅ ejecutable firmado listo"
          else
            echo "⚠️  sin firma configurada - el release quedará sin firmar"
          fi

      - name: Subir ejecutable al release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE="${{ github.event.release.tag_name }}"
          else
            RELEASE="${{ github.ref_name }}"
          fi
          echo "Release objetivo: $RELEASE"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" "dist/${{ matrix.artifact }}" --clobber
          else
            gh release create "$RELEASE" "dist/${{ matrix.artifact }}" \
              --title "PDF Presenter $RELEASE" --generate-notes \
              || gh release upload "$RELEASE" "dist/${{ matrix.artifact }}" --clobber
          fi
